apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-dashboard
  namespace: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-dashboard
  template:
    metadata:
      labels:
        app: redis-dashboard
    spec:
      containers:
        - name: redis-dashboard
          image: rediscommander/redis-commander:latest
          ports:
            - containerPort: 8081
          env:
            - name: REDIS_HOSTS
              value: "local:redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-dashboard
  namespace: redis
spec:
  selector:
    app: redis-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
  type: ClusterIP
